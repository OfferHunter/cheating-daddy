<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>提词 / Teleprompter</title>
        <link rel="stylesheet" href="/app.css" />
        <!-- 桌面当前主题的令牌,由提词服务按渲染端推来的值动态生成;排在 app.css 之后,同名令牌以它为准。 -->
        <link rel="stylesheet" href="/theme.css" />
    </head>
    <body>
        <section id="pairing" class="screen pairing">
            <div class="pair-card">
                <h1 data-i18n="pairTitle"></h1>
                <p class="hint" data-i18n="pairHint"></p>
                <input id="code" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" placeholder="••••••" />
                <button id="pairBtn" class="primary" data-i18n="pairBtn"></button>
                <p id="pairError" class="error" hidden></p>
            </div>
        </section>

        <section id="stage" class="screen stage" hidden>
            <header class="topbar">
                <div class="topbar-left">
                    <span id="conn" class="conn"></span>
                    <button id="refreshBtn" class="icon-btn" aria-label="Clear context">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 1024 1024" fill="currentColor">
                            <path d="M453.312 448H248a29.312 29.312 0 0 0-29.312 29.312v58.688c0 16.192 13.12 29.312 29.312 29.312h528a29.312 29.312 0 0 0 29.312-29.312v-58.688A29.312 29.312 0 0 0 776 448H570.688V184a29.312 29.312 0 0 0-29.376-29.312h-58.624a29.312 29.312 0 0 0-29.376 29.312V448z m-58.624-58.688V154.688c0-32.448 26.24-58.688 58.624-58.688h117.376c32.384 0 58.624 26.24 58.624 58.688v234.624h176c32.448 0 58.688 26.24 58.688 58.688v117.312c0 32.448-26.24 58.688-58.688 58.688v234.688c0 32.384-26.24 58.624-58.624 58.624H277.312a58.688 58.688 0 0 1-58.624-58.624V624a58.688 58.688 0 0 1-58.688-58.688V448c0-32.384 26.24-58.688 58.688-58.688h176z m352 234.688H277.312v205.312c0 16.192 13.184 29.376 29.376 29.376h410.624a29.312 29.312 0 0 0 29.376-29.376V624z m-88 58.688c16.192 0 29.312 13.12 29.312 29.312v146.688h-58.688v-146.688c0-16.192 13.184-29.312 29.376-29.312z m-117.376 58.624c16.192 0 29.376 13.184 29.376 29.376v88H512v-88c0-16.192 13.12-29.376 29.312-29.376z m-117.312 58.688c16.192 0 29.312 13.12 29.312 29.312v29.376h-58.624v-29.376c0-16.192 13.12-29.312 29.312-29.312z" />
                        </svg>
                    </button>
                    <!-- 暂停/继续音源,和桌面端那颗按钮同一个动作。两个图标都在,由 .paused 决定显示哪一个。 -->
                    <button id="pauseBtn" class="icon-btn" aria-label="Pause">
                        <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="5" width="4" height="14" rx="1" />
                            <rect x="14" y="5" width="4" height="14" rx="1" />
                        </svg>
                        <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 5l12 7-12 7z" />
                        </svg>
                    </button>
                    <!-- 结束会话:电源图标,危险色以示和普通图标的区别。按下只让桌面端收尾当前会话并回到主页,
                         绝不退出桌面应用——手机误触不该杀掉电脑上的程序。 -->
                    <button id="endBtn" class="icon-btn danger" aria-label="End session">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <!-- 电源字形上下几乎占满 24 格(墨迹 y 2→22),直接下移会让圆环底边被 viewBox 裁平,所以先按
                                 中心缩到 0.9 让出余量,再整体下移 2 格(≈1.3px)。字形几何其实是居中的,偏上来自开口朝上
                                 的形状在视觉上把整体“抬”了起来,这一步是视觉居中。 -->
                            <g transform="translate(12 14) scale(0.9) translate(-12 -12)">
                                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                                <line x1="12" y1="2" x2="12" y2="12" />
                            </g>
                        </svg>
                    </button>
                </div>
                <!-- 右侧一组:精要/详细/兼有滑块 + 设置。滑块靠右,不再居中。 -->
                <div class="topbar-right">
                    <div class="modes">
                        <button id="modeBrief" class="mode active" data-i18n="modeBrief"></button>
                        <button id="modeDetail" class="mode" data-i18n="modeDetail"></button>
                        <button id="modeBoth" class="mode" data-i18n="modeBoth"></button>
                    </div>
                    <button id="settingsBtn" class="icon-btn" aria-label="Settings">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </header>
            <div class="stage-body">
                <nav id="nav" class="nav" aria-label="Turns"></nav>
                <!-- 单栏: #feed 直接铺满。双栏: #splitView 顶上,左精要、右详细,中间那 6px 是拖拽抓手。两者互斥显隐。 -->
                <main id="feed" class="feed"></main>
                <div id="splitView" class="live-split" hidden>
                    <main id="feedBrief" class="feed"></main>
                    <div id="splitHandle" class="split-handle" role="separator" aria-orientation="vertical"></div>
                    <main id="feedDetail" class="feed"></main>
                </div>
            </div>
            <div id="controlbar" class="controlbar">
                <div id="controlItems" class="control-items">
                    <!-- 不在最底端时点它跳到最新底端并恢复跟随。图标-only,所以不占文字位、不抢截图的视线。 -->
                    <button id="scrollBtn" class="control-btn icon-only" aria-label="Jump to latest">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9l6 6 6-6" />
                        </svg>
                    </button>
                    <!-- 笔试时右侧并排两颗:先进缓存,再「截图并发送」。面试只留原来那颗截图键。 -->
                    <div class="control-right">
                        <button id="cacheBtn" class="control-btn" hidden>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                                <circle cx="12" cy="13" r="4" />
                            </svg>
                            <span data-i18n="cacheBtn"></span>
                        </button>
                        <button id="shotBtn" class="control-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                                <circle cx="12" cy="13" r="4" />
                            </svg>
                            <span id="shotLabel" data-i18n="shotBtn"></span>
                            <span id="shotSendLabel" data-i18n="shotSendBtn" hidden></span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="settings" class="screen settings" hidden>
            <header class="topbar">
                <button id="settingsBack" class="icon-btn back" aria-label="Back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                </button>
                <h1 class="settings-title" data-i18n="settingsTitle"></h1>
            </header>
            <div class="settings-body">
                <div class="setting-head">
                    <label for="questionRange" data-i18n="questionFontLabel"></label>
                    <span id="questionValue" class="setting-value"></span>
                </div>
                <input id="questionRange" class="range" type="range" min="12" max="32" step="1" />
                <p class="sample question-sample" data-i18n="fontSampleQuestion"></p>

                <div class="setting-head">
                    <label for="answerRange" data-i18n="answerFontLabel"></label>
                    <span id="answerValue" class="setting-value"></span>
                </div>
                <input id="answerRange" class="range" type="range" min="12" max="32" step="1" />
                <p class="sample answer-sample" data-i18n="fontSampleAnswer"></p>
            </div>
        </section>

        <script src="/marked.min.js"></script>
        <script src="/app.js"></script>
    </body>
</html>
